
name: Storage Layout

on:
  push:
    branches:
      - master
      - mainnet
      - testnet-goerli
      - dev
  pull_request:

jobs:
  check_storage:
    name: CI
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: "Generate and prepare the storage reports for current branch"
        run: |
          bash ./bin/storage-report.sh pr

      - name: Checkout dev
        env:
          TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin $TARGET
          git checkout $TARGET

      - name: "Generate and prepare the storage reports for target branch"
        run: |
          bash ./bin/storage-report.sh target

      - name: Normalize file names for comparison
        run: |
          # Create normalized copies of both directories
          mkdir -p pr_normalized target_normalized
          
          # Normalize PR files (convert new naming convention to old)
          for file in pr/*.md; do
            if [ -f "$file" ]; then
              # Extract the actual contract name from the new naming convention
              # Convert something like "middlewareV2_registrar_AVSRegistrar.md" to "AVSRegistrar.md"
              basename_file=$(basename "$file")
              # Get the last part after the last underscore (the actual contract name)
              contract_name=$(echo "$basename_file" | sed 's/.*_\([^_]*\)\.md$/\1.md/')
              # If no underscores found, use the original name
              if [ "$contract_name" = "$basename_file" ]; then
                contract_name="$basename_file"
              fi
              cp "$file" "pr_normalized/$contract_name"
            fi
          done
          
          # Normalize target files (handle both old and new naming conventions)
          for file in target/*.md; do
            if [ -f "$file" ]; then
              basename_file=$(basename "$file")
              # Get the last part after the last underscore (the actual contract name)
              contract_name=$(echo "$basename_file" | sed 's/.*_\([^_]*\)\.md$/\1.md/')
              # If no underscores found, use the original name
              if [ "$contract_name" = "$basename_file" ]; then
                contract_name="$basename_file"
              fi
              cp "$file" "target_normalized/$contract_name"
            fi
          done

      - name: Compare outputs
        run: |
          if diff --unified pr_normalized target_normalized; then
            echo "No differences found"
          else
            echo "::error::Differences found between PR and target branch storage layouts"
            exit 1
          fi