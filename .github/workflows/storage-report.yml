
name: Storage Layout

on:
  push:
    branches:
      - master
      - mainnet
      - testnet-goerli
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  check_storage:
    name: CI
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: nightly

      - name: "Generate and prepare the storage reports for current branch"
        run: |
          bash ./bin/storage-report.sh pr

      - name: Checkout dev
        env:
          TARGET: ${{ github.event.pull_request.base.sha }}
        run: |
          # Validate TARGET is a valid SHA (enhanced validation)
          if [ -z "$TARGET" ]; then
            echo "::error::TARGET SHA is empty"
            exit 1
          fi
          if ! echo "$TARGET" | grep -qE '^[a-f0-9]{40}$'; then
            echo "::error::Invalid SHA format: $TARGET"
            exit 1
          fi
          git fetch origin "$TARGET"
          git checkout "$TARGET"

      - name: "Generate and prepare the storage reports for target branch"
        run: |
          bash ./bin/storage-report.sh target

      - name: Compare outputs
        run: |
          if diff --unified pr target; then
            echo "No differences found"
          else
            echo "::error::Differences found between PR and target branch storage layouts"
            exit 1
          fi
